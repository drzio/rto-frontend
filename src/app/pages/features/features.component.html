<div class="page-wrapper">
    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="mesh"></div>
    </div>

    <div class="hero-banner">
        <div class="container">
            <span class="badge-pill">Platform Features</span>
            <h1>Why Choose <span>RTO Nexus</span></h1>
            <p>Discover the powerful tools we provide to simplify your RTO experience.</p>
        </div>
    </div>

    <section class="glass-section">
        <div class="container">
            <div class="theme-feature-grid">
                <div class="theme-feature-card" *ngFor="let feature of features">
                    <div class="card-icon">
                        <i class="fa-solid" [ngClass]="feature.icon"></i>
                    </div>
                    <h3>{{feature.title}}</h3>
                    <p>{{feature.desc}}</p>
                </div>
            </div>

            <!-- CTA Section -->
            <div class="cta-card">
                <h2>Ready to get started?</h2>
                <p>Join thousands of users who trust our system for their RTO needs.</p>
                <a routerLink="/register" class="theme-btn">
                    <span class="text">Register Now</span>
                    <span class="icon"><i class="fa-solid fa-arrow-right"></i></span>
                </a>
            </div>
        </div>
    </section>
</div>
