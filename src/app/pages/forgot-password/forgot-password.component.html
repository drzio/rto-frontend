<div class="auth-wrapper">
    <div class="auth-card-single">
        <div class="auth-box">
            <div class="logo-area">
                <i class="fa-solid fa-building-columns" style="font-size: 32px; color: #2CA58D;"></i>
                <h2>RTO Services</h2>
            </div>

            <div *ngIf="step === 1">
                <h3>Forgot Password?</h3>
                <p class="subtitle">Enter your email to receive a password reset OTP</p>

                <form (ngSubmit)="handleRequestOtp()">
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email"
                                required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Send OTP</button>
                </form>
            </div>

            <div *ngIf="step === 2">
                <h3>Reset Password</h3>
                <p class="subtitle">Enter the 6-digit OTP sent to <strong>{{ email }}</strong></p>

                <form (ngSubmit)="handleResetPassword()">
                    <div class="input-group">
                        <label>6-Digit OTP</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-key"></i>
                            <input type="text" [(ngModel)]="otp" name="otp" maxlength="6" placeholder="123456" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>New Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" [(ngModel)]="newPassword" name="newPassword"
                                placeholder="Enter new password" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
                                placeholder="Confirm new password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Reset Password</button>
                </form>

                <p class="footer-text"><a href="javascript:void(0)" (click)="step = 1">Back to Email</a></p>
            </div>

            <div class="footer-links">
                <a routerLink="/login" class="back-link">Back to Login</a>
            </div>
        </div>
    </div>
</div>
