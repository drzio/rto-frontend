<div class="page-wrapper">
    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="mesh"></div>
    </div>

    <div class="hero-banner">
        <div class="container">
            <span class="badge-pill">Print Forms</span>
            <h1>Download <span>Application Forms</span></h1>
            <p>Download your official application forms (Form 1, etc.)</p>
        </div>
    </div>

    <section class="glass-section">
        <div class="container">
            <div class="glass-card-main narrow">
                <h2 class="card-section-title">Print Application Forms</h2>

                <div class="form-group" style="margin-bottom: 22px;">
                    <label
                        style="display:block; margin-bottom:8px; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light);">Application
                        Number</label>
                    <input type="text" [(ngModel)]="formData.applicationNo"
                        placeholder="Enter Application No (e.g., APP-...)"
                        style="width:100%; padding:12px; border:2px solid #f1f5f9; border-radius:12px; outline:none; font-size:0.95rem; transition:border-color 0.3s; font-family:inherit;">
                </div>

                <div class="form-group" style="margin-bottom: 22px;">
                    <label
                        style="display:block; margin-bottom:8px; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light);">Date
                        of Birth</label>
                    <input type="date" [(ngModel)]="formData.dob"
                        style="width:100%; padding:12px; border:2px solid #f1f5f9; border-radius:12px; outline:none; font-size:0.95rem; transition:border-color 0.3s; font-family:inherit;">
                </div>

                <button class="theme-btn" (click)="downloadForm()" [disabled]="loading" style="margin-top: 10px;">
                    <i class="fa-solid fa-file-pdf" *ngIf="!loading"></i>
                    <i class="fa-solid fa-spinner fa-spin" *ngIf="loading"></i>
                    {{ loading ? 'Generating PDF...' : 'Download Form 1' }}
                </button>

                <p
                    style="margin-top: 20px; font-size: 0.88rem; color: var(--text-light); display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-circle-info" style="color: var(--primary-color);"></i>
                    Currently supports <strong>Form 1 (Self Declaration)</strong>.
                </p>
            </div>
        </div>
    </section>
</div>
