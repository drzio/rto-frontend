<div class="auth-wrapper">
    <div class="auth-card-single">
        <div class="auth-box">
            <div class="logo-area">
                <i class="fa-solid fa-building-columns" style="font-size: 32px; color: #2CA58D;"></i>
                <h2>RTO Services</h2>
            </div>

            <h3>Verify Your Account</h3>
            <p class="subtitle">An OTP has been sent to <strong>{{ email }}</strong></p>

            <form (ngSubmit)="verifyOtp()">
                <div class="input-group">
                    <label for="otp">Enter 6-Digit OTP</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="text" id="otp" name="otp" [(ngModel)]="otp" maxlength="6" placeholder="123456"
                            required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" [disabled]="otp.length !== 6">
                    Verify & Login
                </button>
            </form>

            <div class="footer-links">
                <p>Didn't receive code? <a href="javascript:void(0)" (click)="resendOtp()">Resend OTP</a></p>
                <a routerLink="/register" class="back-link">Back to Register</a>
            </div>
        </div>
    </div>
</div>
