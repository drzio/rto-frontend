<div class="page-wrapper">
    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="mesh"></div>
    </div>

    <div class="hero-banner">
        <div class="container">
            <span class="badge-pill">Account Settings</span>
            <h1>Update <span>Mobile Number</span></h1>
            <p>Securely update your registered mobile number using OTP verification.</p>
        </div>
    </div>

    <section class="glass-section">
        <div class="container">
            <div class="glass-card-main narrow">
                <!-- Step 1: Details -->
                <div *ngIf="step === 'details'" class="form-section">
                    <h2 class="card-section-title">Enter Details</h2>

                    <div class="form-group" style="margin-bottom: 22px;">
                        <label
                            style="display:block; margin-bottom:8px; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light);">Driving
                            License Number</label>
                        <input type="text" [(ngModel)]="formData.licenseNo"
                            placeholder="Enter DL Number (e.g., APP-...)"
                            style="width:100%; padding:12px; border:2px solid #f1f5f9; border-radius:12px; outline:none; font-size:0.95rem; font-family:inherit;">
                    </div>

                    <div class="form-group" style="margin-bottom: 22px;">
                        <label
                            style="display:block; margin-bottom:8px; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light);">Old
                            Mobile Number</label>
                        <input type="text" [(ngModel)]="formData.oldMobile"
                            placeholder="Enter current registered mobile" maxlength="10"
                            style="width:100%; padding:12px; border:2px solid #f1f5f9; border-radius:12px; outline:none; font-size:0.95rem; font-family:inherit;">
                    </div>

                    <div class="form-group" style="margin-bottom: 22px;">
                        <label
                            style="display:block; margin-bottom:8px; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light);">New
                            Mobile Number</label>
                        <input type="text" [(ngModel)]="formData.newMobile" placeholder="Enter new mobile number"
                            maxlength="10"
                            style="width:100%; padding:12px; border:2px solid #f1f5f9; border-radius:12px; outline:none; font-size:0.95rem; font-family:inherit;">
                    </div>

                    <button class="theme-btn" (click)="sendOtp()" [disabled]="loading">
                        <i class="fa-solid fa-paper-plane" *ngIf="!loading"></i>
                        <i class="fa-solid fa-spinner fa-spin" *ngIf="loading"></i>
                        {{ loading ? 'Sending OTP...' : 'Send OTP' }}
                    </button>
                </div>

                <!-- Step 2: OTP Verification -->
                <div *ngIf="step === 'otp'" class="form-section">
                    <h2 class="card-section-title">Verify OTP</h2>

                    <div
                        style="background: rgba(44,165,141,0.08); border: 1px solid rgba(44,165,141,0.2); border-radius: 14px; padding: 15px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-circle-info" style="color: var(--primary-color);"></i>
                        <span style="font-size: 0.9rem;">OTP has been sent to <strong>{{ formData.newMobile
                                }}</strong></span>
                    </div>

                    <div class="form-group" style="margin-bottom: 22px;">
                        <label
                            style="display:block; margin-bottom:8px; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light);">Enter
                            OTP</label>
                        <input type="text" [(ngModel)]="otp" placeholder="Enter 6-digit OTP" maxlength="6"
                            style="width:100%; padding:12px; border:2px solid #f1f5f9; border-radius:12px; outline:none; font-size:1.2rem; text-align:center; letter-spacing:8px; font-family:inherit;">
                    </div>

                    <div style="display: flex; gap: 12px;">
                        <button class="theme-btn" (click)="verifyOtp()" [disabled]="loading">
                            <i class="fa-solid fa-check-circle" *ngIf="!loading"></i>
                            <i class="fa-solid fa-spinner fa-spin" *ngIf="loading"></i>
                            {{ loading ? 'Verifying...' : 'Verify & Update' }}
                        </button>
                        <button class="theme-btn outline" (click)="step = 'details'" [disabled]="loading">Back</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
